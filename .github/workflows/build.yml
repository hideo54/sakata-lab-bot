name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          working-directory: functions
          cache: true
          require-lockfile: true
      - run: pnpm run build
